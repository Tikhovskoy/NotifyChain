# Override для разработки. Запуск вместе с основным файлом:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Здесь runserver вместо gunicorn, dev-настройки, код из рабочей папки (правки видны сразу)
# и открытые порты БД и Redis для отладки с хоста.

services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: notifychain.settings.dev
    volumes:
      - .:/app

  celery:
    environment:
      DJANGO_SETTINGS_MODULE: notifychain.settings.dev
    volumes:
      - .:/app

  redis:
    ports:
      - "6379:6379"

  db:
    ports:
      - "5432:5432"
